name: Build and publish multi-arch FastDFS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to publish (must not already exist)
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read

concurrency:
  group: aliyun-fastdfs-${{ inputs.image_tag }}
  cancel-in-progress: false

env:
  REGISTRY: registry.cn-chengdu.aliyuncs.com
  IMAGE: registry.cn-chengdu.aliyuncs.com/gmsoft-syh/qbanxiaoli-fastdfs

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate tag and required secret
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY_CREDENTIAL: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        shell: bash
        run: |
          # Reject invalid tags before passing user input to Docker commands.
          set -euo pipefail
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid Docker image tag.' >&2
            exit 1
          fi
          if [[ -z "$REGISTRY_CREDENTIAL" ]]; then
            echo 'Missing repository secret: ALIYUN_REGISTRY_PASSWORD' >&2
            exit 1
          fi

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: lunrry
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          logout: true

      - name: Refuse to overwrite an existing image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          # An authentication or network failure must not be mistaken for an absent tag.
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" >manifest-check.log 2>&1; then
            echo 'The requested image tag already exists; choose a new version.' >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|no such manifest' manifest-check.log; then
            cat manifest-check.log >&2
            exit 1
          fi

      - name: Build and push AMD64 and ARM64 images
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.image_tag }}
          # Keep a two-platform manifest without additional attestation descriptors.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published multi-platform manifest
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          # Read back the exact pushed digest and confirm both requested architectures exist.
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --raw >manifest.json
          python3 - <<'PY'
          import json
          with open('manifest.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          platforms = {
              (item.get('platform', {}).get('os'), item.get('platform', {}).get('architecture'))
              for item in manifest.get('manifests', [])
          }
          expected = {('linux', 'amd64'), ('linux', 'arm64')}
          if platforms != expected:
              raise SystemExit(f'Unexpected platforms: {platforms!r}')
          print('Verified platforms: linux/amd64, linux/arm64')
          PY
          {
            echo '### Published FastDFS image'
            printf '\n- Image: `%s:%s`\n' "$IMAGE" "$IMAGE_TAG"
            printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            echo '- Platforms: `linux/amd64`, `linux/arm64`'
          } >> "$GITHUB_STEP_SUMMARY"
